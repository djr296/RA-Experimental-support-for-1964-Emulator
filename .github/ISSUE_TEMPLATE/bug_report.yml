name: Bug report
description: Report a problem with the Casual-mode proxy
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload ROMs, game assets, passwords, RetroAchievements tokens, or an unsanitized `1964-ra.ini`.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - GoldenEye 007
        - Perfect Dark
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Proxy version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and exact steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized log excerpt
      description: Remove usernames, tokens, passwords, ROM paths, and other private information first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I did not attach a ROM, game asset, password, or RetroAchievements token.
          required: true
        - label: I understand this integration supports Casual mode only.
          required: true

